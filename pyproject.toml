[project]
name = "clinical-extraction-engine"
version = "0.0.1"
description = "Config-driven structured extraction from clinical free text: task packs, constrained decoding, validation, evals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine", "engine.backends", "evalharness", "adapters", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
