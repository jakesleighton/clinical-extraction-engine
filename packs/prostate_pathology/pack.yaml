# =============================================================================
# PROSTATE PATHOLOGY PACK — extends base
# =============================================================================
# Vocabulary for prostate surgical pathology reports (TCGA-PRAD in Phase 0/1).
# Everything document-agnostic (three-state status, hedging, evidence, negation,
# amendments) comes from packs/base/pack.yaml. Any field key not set here
# (status, evidence, tier, kind) takes the base default.
# =============================================================================

pack:
  name: prostate_pathology
  version: 4            # 1: Phase 0 scaffold; 2: Phase 1 exemplars + procedure-from-specimen rule;
                        # 3: derived pT/pN with provenance, stage instructions "as printed",
                        #    hedging exemplar as an opt-in variant, lenient pT scoring
                        # 4: stated_pattern guard on the derived fields (a stated stage or Grade
                        #    Group must quote a printed one), nodes_positive read as a count,
                        #    instruction sentences for pN, grade_group, nodes_positive, margin_positive
  extends: base

document:
  type: surgical_pathology_report
  unit: report                   # one extraction call covers one report
  case_grouping: patient_id      # reconciliation groups reports by patient

instructions:
  domain: |
    This is a prostate surgical pathology report. It may contain a gross
    description, a microscopic description, a final diagnosis, a CAP synoptic
    summary, and addenda.

    Multiple specimen parts: report items for the prostate carcinoma. For a
    radical prostatectomy, use the dominant (index) tumor. For multiple
    biopsy parts, use the part with the highest Gleason score, and set
    conflict to true if parts differ.

    Gleason: primary and secondary are the two patterns in the score as
    written ("Gleason 3+4=7" gives primary 3, secondary 4, total 7). A
    tertiary pattern is not the secondary pattern.

fields:
  # --- Specimen ----------------------------------------------------------------
  - id: specimen_procedure
    type: enum
    allowed: [radical_prostatectomy, needle_biopsy, transurethral_resection, lymph_node_dissection, other]
    tier: deterministic
    instructions: >
      The procedure that produced the main specimen. A prostatectomy with
      attached lymph node dissection is radical_prostatectomy. When the report
      never names the procedure, classify it from the specimen it describes and
      quote that description: a whole prostate with seminal vesicles is
      radical_prostatectomy, needle cores are needle_biopsy, resection chips
      are transurethral_resection.

  - id: tumor_laterality
    type: enum
    allowed: [left, right, bilateral]
    instructions: >
      Side(s) of the prostate involved by carcinoma. bilateral if tumor is
      present in both lobes.

  - id: report_date
    type: date
    tier: deterministic
    instructions: Date the report was signed out or finalized.

  - id: collection_date
    type: date
    tier: deterministic
    instructions: Date the specimen was collected or the procedure performed.

  # --- Tumor -------------------------------------------------------------------
  - id: histologic_type
    type: enum
    allowed: [acinar_adenocarcinoma, ductal_adenocarcinoma, mixed_acinar_ductal, small_cell_carcinoma, other]
    instructions: >
      Histologic type of the carcinoma. "Adenocarcinoma" with no subtype means
      acinar_adenocarcinoma.

  - id: gleason_primary
    type: integer
    allowed: [1, 2, 3, 4, 5]
    instructions: >
      Primary (most prevalent) Gleason pattern, the first number in the
      Gleason score as written.

  - id: gleason_secondary
    type: integer
    allowed: [1, 2, 3, 4, 5]
    instructions: >
      Secondary Gleason pattern, the second number in the Gleason score as
      written. Not the tertiary pattern.

  - id: gleason_total
    type: integer
    allowed: [2, 3, 4, 5, 6, 7, 8, 9, 10]
    instructions: >
      Gleason score (sum), as stated in the report. Do not add the patterns
      yourself if the sum is not written.

  - id: grade_group
    type: integer
    allowed: [1, 2, 3, 4, 5]
    instructions: >
      ISUP/WHO Grade Group, only when the report literally prints it ("Grade
      Group 3", "ISUP 3", "WHO grade group 3"). A Gleason score alone is not a
      Grade Group, and neither is a histologic grade ("G3", "grade 3 of 4",
      "poorly differentiated"): then status is not_mentioned. Never compute
      it from the Gleason patterns; the engine derives it after extraction,
      with provenance.

  - id: tumor_percent_of_gland
    type: number
    unit: percent
    tier: hard
    instructions: >
      Percentage of the prostate involved by tumor, if stated
      ("approximately 15% of the gland").

  - id: tumor_dimension
    type: measurement
    units: [mm, cm]
    tier: hard
    instructions: >
      Greatest dimension of the dominant tumor nodule, if stated.

  # --- Extent and invasion (findings: present = value, negative = explicitly_absent)
  - id: extraprostatic_extension
    type: enum
    kind: finding
    allowed: [focal, nonfocal, present_unspecified]
    instructions: >
      Extraprostatic extension. "Established" or "extensive" is nonfocal.

  - id: seminal_vesicle_invasion
    type: enum
    kind: finding
    allowed: [left, right, bilateral, present_unspecified]
    instructions: >
      Seminal vesicle invasion by carcinoma; value gives the side if stated.

  - id: margin_positive
    type: enum
    kind: finding
    allowed: [focal, extensive, present_unspecified]
    instructions: >
      Carcinoma at the inked surgical margin. "Margins negative" or "free of
      tumor" is explicitly_absent. An unclear, equivocal or "cannot be
      excluded" margin is focal (or present_unspecified) with hedging
      possible or probable, not explicitly_absent.

  - id: margin_location
    type: string
    tier: hard
    instructions: >
      Named location(s) of a positive margin (e.g. "right posterolateral",
      "apex"). not_mentioned when margins are negative.

  - id: margin_distance
    type: measurement
    units: [mm, cm]
    tier: hard
    instructions: >
      Distance of tumor to the closest margin, when margins are negative and
      the distance is stated.

  - id: lymphovascular_invasion
    type: enum
    kind: finding
    allowed: [present]
    instructions: Lymphovascular (angiolymphatic) invasion.

  - id: perineural_invasion
    type: enum
    kind: finding
    allowed: [present]
    instructions: Perineural invasion.

  # --- Nodes and stage ---------------------------------------------------------
  - id: nodes_examined
    type: integer
    tier: deterministic
    instructions: >
      Total number of regional lymph nodes examined. explicitly_absent if the
      report says no lymph nodes were submitted or found.

  - id: nodes_positive
    type: integer
    tier: deterministic
    instructions: >
      Number of lymph nodes containing metastatic carcinoma. This is a count:
      0 when nodes were examined and none has tumor ("0/12", "negative for
      metastasis"); explicitly_absent only when no lymph nodes were examined.

  - id: pT
    type: enum
    allowed: [pT2, pT2a, pT2b, pT2c, pT2+, pT3, pT3a, pT3b, pT4, pTX]
    tier: deterministic
    instructions: >
      Pathologic T stage as written, with the "p" prefix; drop other prefixes
      or suffixes (y, m, r) and record them in evidence. Only a stage the
      report prints counts ("pT3a", "T2c N0", "Stage: T2"): when no T stage
      is written, status is not_mentioned. Never infer a stage from the
      findings; the engine derives it after extraction, with provenance.

  - id: pN
    type: enum
    allowed: [pN0, pN1, pNX]
    tier: deterministic
    instructions: >
      Pathologic N stage as written, with the "p" prefix; "pNO" or "NO" with
      the letter O is pN0. Only a stage the report prints counts: when no N
      stage is written, status is not_mentioned. A lymph node finding ("1 of
      7 nodes positive", "lymph nodes negative for tumor") is not an N stage,
      and a stage line without an N category ("pT3a pMX") has none: both are
      not_mentioned. Never infer it from the lymph node counts; the engine
      derives it after extraction, with provenance.

  # --- Treatment ---------------------------------------------------------------
  - id: treatment_effect
    type: enum
    kind: finding
    allowed: [minimal, moderate, marked, present_unspecified]
    tier: hard
    instructions: >
      Histologic evidence of prior therapy (hormonal or radiation effect) on
      the carcinoma.

# -----------------------------------------------------------------------------
# Cross-field rules. Grammar-constrained decoding guarantees each field's shape
# but cannot express relationships between fields; these catch those.
# A rule runs only when every field it names has status=value.
# Functions available in rules come from the whitelisted library in
# engine/rules.py (e.g. grade_group_from).
# -----------------------------------------------------------------------------
validation:
  - id: gleason_sum
    rule: "gleason_primary + gleason_secondary == gleason_total"
    on_fail: retry_then_flag     # Phase 2 wires the retry; Phase 1 just flags

  - id: grade_group_matches_gleason
    rule: "grade_group == grade_group_from(gleason_primary, gleason_secondary)"
    on_fail: retry_then_flag

  - id: nodes_positive_le_examined
    rule: "nodes_positive <= nodes_examined"
    on_fail: retry_then_flag

  - id: pN_matches_nodes
    rule: "(pN == 'pN1') == (nodes_positive > 0)"
    on_fail: flag

# -----------------------------------------------------------------------------
# Derived fields (engine-computed, see base pack). The model only reports
# what the document prints; the engine fills what the findings imply, and the
# record says which (derivation: stated | computed_from_...).
#   grade_group  older reports print only the Gleason score: computed from the
#                patterns when the model found no printed Grade Group.
#   pT, pN       about a fifth of the corpus (two report templates) prints no
#                stage line at all. pT is computed from the extent findings of
#                a radical prostatectomy, pN from the node counts, only when
#                the report prints no stage (`when: check`: a printed stage
#                stands, and a disagreement with the findings is flagged).
#                The eval scores `stated` and derived cases separately,
#                anchored on gold columns that say whether the text prints a
#                stage (scripts/join_gold_labels.py), never on the model's claim.
#   stated_pattern (v4) a value the model calls stated must quote a span that
#                prints one; the gold join fills the `stated_column` with the
#                same regex. A stage returned from a node finding, or a Grade
#                Group from a histologic grade, is set aside and derived instead
#                (flag stated_without_printed_value). Verbose regexes: whitespace
#                and the # comments are ignored by the engine.
# -----------------------------------------------------------------------------
derived_fields:
  - id: grade_group
    derivation: computed_from_gleason
    inputs: [gleason_primary, gleason_secondary]
    rule: "grade_group_from(gleason_primary, gleason_secondary)"
    when: not_stated
    evidence: inherit
    stated_column: grade_group_printed     # gold column: does the report text print a Grade Group?
    stated_pattern: |-                     # verbose regex: whitespace and the # comments are ignored
      (?ix)                                # case-insensitive; a Gleason score or "ISUP 2005" never matches
      \b(?:grade\s*groups?|isup(?:\s*(?:grade|group))?|gg)   # "Grade Group", "ISUP grade", "GG"
      (?:\s*\(isup\))?\s*(?:grade\s*)?[:=\-]?\s*(?:of\s+)?    # "Grade Group (ISUP) 2", "grade group of 4"
      ([1-5])\b                                              # the group itself
    eval_note: >
      TCGA gold Grade Group is derived from the Gleason patterns for every
      case (GDC records none), so both subsets are scored against a
      Gleason-derived value: on `stated`, a report whose printed Grade Group
      disagrees with its own Gleason score cannot score correct, and on the
      derived subset a Gleason error and a Grade Group error are the same
      error counted twice. None of the 446 staged TCGA-PRAD reports prints a
      Grade Group (they predate the 2014 ISUP system), so here `stated` is
      empty and every "stated" Grade Group the model claims is invented.

  - id: pT
    derivation: computed_from_findings
    inputs:
      specimen_procedure: required          # only a radical prostatectomy has a pathologic T
      extraprostatic_extension: finding     # present -> its value; "not identified" -> absent; silence blocks
      seminal_vesicle_invasion: finding
      tumor_laterality: optional            # pT2c needs bilateral; without it the rule says pT2
    rule: "pt_from_findings(specimen_procedure, extraprostatic_extension, seminal_vesicle_invasion, tumor_laterality)"
    when: check                             # a printed stage stands; a disagreement is flagged
    on_none: skip                           # a biopsy has no pathologic stage: leave pT as extracted
    evidence: inherit
    stated_column: pT_printed               # gold column: does the report text print a T category?
    stated_pattern: |-                      # verbose regex: whitespace and the # comments are ignored
      (?x)                                  # "pt" in lower case is never a stage (a word, or "pt."), so the
                                            # p-forms are case-sensitive; the stage-word form is not. The OCR
                                            # put a period at every original line or field break, hence the
                                            # optional periods ("p. T 3a", "T 3a. N 0": one site's template)
      (?<![A-Za-z])[ymr]?[pP]\.?\s?T\s?[1-4]              # "pT3a", "ypT2c", "PT2" (one all-caps site), "p. T 3a"
      | \bT\s?[1-4][a-c]?\s*[,.]?\s*p?N\s?[0-3XxOoI]     # a TNM string without the p: "T2c N0", "T 3a NO", "T 3a. N 0"
      | (?i:stag(?:e|ing))[^.\n]{0,20}\bT\s?[1-4]        # "Stage: T2", "stage is T1", "Staging (pTNM): T 3a"
    eval_note: >
      computed_from_findings covers pT2 to pT3b (seminal vesicle invasion is
      pT3b, extraprostatic extension pT3a, neither is organ-confined: pT2c
      when bilateral, otherwise pT2); pT4 needs adjacent-organ findings the
      pack does not extract, so a pT4 case can only be stated. The AJCC 7th
      edition pT2 substages depend on tumor laterality and extent the text
      often does not give, which is what the lenient column is for.

  - id: pN
    derivation: computed_from_nodes
    inputs:
      nodes_examined: required              # no node examined: the rule returns None (on_none: skip)
      nodes_positive: count                 # "no metastasis" written as explicitly_absent counts as 0
    rule: "pn_from_nodes(nodes_examined, nodes_positive)"
    when: check
    on_none: skip                           # no node examined: no pathologic N
    evidence: inherit
    stated_column: pN_printed               # gold column: does the report text print an N category?
    stated_pattern: |-                      # verbose regex: whitespace and the # comments are ignored
      (?x)                                  # the OCR's letter O and I stand for 0 and 1; a category may run
                                            # straight into a following M, R, L, V or G descriptor or a "pM",
                                            # not into any other letter ("T2c Nodes" is not a stage); the
                                            # optional periods are the OCR's line and field breaks ("N 0. M X")
      (?<![A-Za-z])[ymr]?[pP]N\s?[0-3XxOoI](?=$|[^A-Za-z0-9]|[MmRrLlVvGg]|[pP][Mm])           # "pN0", "pNO", "pNI", "pNX"
      | \bN\s?[0-3XxOo]\s*[,.]?\s*p?M\s?[01xX]                                                # "N0 M0", "N 0. M X"
      | \b[pP]?T\s?[1-4][a-c]?\s*[,.]?\s*p?N\s?[0-3XxOoI](?=$|[^A-Za-z0-9]|[MmRrLlVvGg]|[pP][Mm])  # "pT2c NO", "T3a, N1", "pT3bNOMX", "pT3apN0pMX", "T 3a. N 0"
    eval_note: >
      computed_from_nodes is pN1 when any examined node is positive and pN0
      when at least one node was examined and none is; pNX is never derived.
      The validation rule pN_matches_nodes checks the same relationship on a
      printed stage.

# -----------------------------------------------------------------------------
# Case-level precedence (several reports for one patient). Declared now,
# executed in Phase 2. Rules confirmed with the clinical side before Phase 5.
# -----------------------------------------------------------------------------
reconciliation:
  precedence: [prostatectomy_over_biopsy, highest_grade_among_cores]

# Phase 1 exemplars (approved 2026-10-19): three clean TCGA-PRAD reports with the
# output the model should imitate. `case_id` names the eval case an exemplar was
# taken from; the eval runner holds those cases out of every run, since a case
# that sits in the prompt cannot also be scored. Each pair is checked by
# tests/test_exemplars.py (every quote found verbatim, validator clean).
#   EJ-7315: EJ template, 4+3 with a tertiary 5, established EPE, negative margins, pT3a pN0 ("NO")
#   HC-A6AN: CAP synoptic, focal EPE, focal positive margin with location, 0/1 nodes, pT3a
#   ZG-A8QW: European style, 4+5, 46 mm, bilateral SVI, 1/13 nodes, pT3b pN1, LVI stated absent
#            but argued present in a comment (conflict: true)
exemplars:
  - {case_id: TCGA-EJ-7315, source: exemplars/TCGA-EJ-7315.txt, output: exemplars/TCGA-EJ-7315.json}
  - {case_id: TCGA-HC-A6AN, source: exemplars/TCGA-HC-A6AN.txt, output: exemplars/TCGA-HC-A6AN.json}
  - {case_id: TCGA-ZG-A8QW, source: exemplars/TCGA-ZG-A8QW.txt, output: exemplars/TCGA-ZG-A8QW.json}
# Ablation arm "+hedging exemplar" (approved after the Phase 1 baseline showed
# three of five models calling the deliberately hedged margin definite): V1-A9Z7
# (equivocal bladder-neck margin, hedging: possible) is in the prompt only when a
# run asks for it (`--exemplar-variant hedging`); its case is held out of every
# eval regardless, so the baseline and the ablation arm score the same cases.
  - {case_id: TCGA-V1-A9Z7, source: exemplars/TCGA-V1-A9Z7.txt, output: exemplars/TCGA-V1-A9Z7.json, variant: hedging}

eval:
  gold: labels/tcga_prad_gold.csv
  id_column: case_id
  scored: [gleason_primary, gleason_secondary, gleason_total, grade_group, pT, pN]
  lenient: {pT: prefix}    # an extra, labelled row: a printed pT3 counts against gold pT3a; exact stays the headline
